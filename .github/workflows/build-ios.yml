name: Build iOS App (SFI)

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build SFI for iOS
    runs-on: macos-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: latest-stable
      
      - name: Display Xcode version
        run: xcodebuild -version
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      
      - name: Cache Libbox.xcframework
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: Libbox.xcframework
          key: libbox-xcframework-${{ runner.os }}-${{ hashFiles('.github/workflows/build-ios.yml') }}
          restore-keys: |
            libbox-xcframework-${{ runner.os }}-
      
      - name: Build Libbox.xcframework
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        run: |
          set -e
          echo "Building Libbox.xcframework from sing-box repository..."
          
          # Clone sing-box repository
          git clone --depth 1 --branch dev-next https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          
          # Install gomobile
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          
          # Build the xcframework for iOS
          go run ./cmd/internal/build_libbox -target apple -platform ios,iossimulator
          
          # Copy to the project directory
          if [ -d "Libbox.xcframework" ]; then
            cp -R Libbox.xcframework "$GITHUB_WORKSPACE/"
            echo "Libbox.xcframework built and copied successfully"
            ls -la "$GITHUB_WORKSPACE/Libbox.xcframework"
          else
            echo "Error: Libbox.xcframework was not created"
            exit 1
          fi
      
      - name: Verify Libbox.xcframework
        run: |
          if [ ! -d "Libbox.xcframework" ]; then
            echo "Error: Libbox.xcframework not found"
            exit 1
          fi
          echo "Libbox.xcframework is present"
          ls -la Libbox.xcframework
      
      - name: Create build directory
        run: mkdir -p build
      
      - name: Archive iOS App
        run: |
          set -e
          xcodebuild archive \
            -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SFI.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      
      - name: Export IPA
        run: |
          set -e
          xcodebuild -exportArchive \
            -archivePath build/SFI.xcarchive \
            -exportOptionsPlist SFI/Export.plist \
            -exportPath build/SFI
      
      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-unsigned-ipa
          path: build/SFI/*.ipa
          if-no-files-found: error
          retention-days: 30
      
      - name: Upload archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-xcarchive
          path: build/SFI.xcarchive
          retention-days: 7
      
      - name: List build outputs
        run: |
          echo "Build completed successfully!"
          echo "Artifacts:"
          ls -lh build/SFI/
          echo ""
          echo "The unsigned IPA is ready for signing and installation."
