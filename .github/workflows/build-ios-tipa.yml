name: build-ios-tipa

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag/SHA to package (manual runs)
        required: true
        default: dev
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build iOS (.tipa)
    runs-on: macos-14

    env:
      PROJECT_PATH: sing-box.xcodeproj
      SCHEME: SFI
      CONFIGURATION: Release
      DERIVED_DATA: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install ldid (TrollStore signing)
        run: |
          set -euo pipefail
          brew update
          brew install ldid

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/*.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve package dependencies
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME"

      - name: Compute version
        id: version
        shell: bash
        env:
          REF_INPUT: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail

          REF_NAME="${GITHUB_REF_NAME}"
          if [[ -n "${REF_INPUT}" ]]; then
            REF_NAME="${REF_INPUT}"
          fi

          # sanitize: keep alnum, dot, underscore, dash; replace others with '-'
          REF_SLUG=$(echo "$REF_NAME" | sed -E 's/[^A-Za-z0-9._-]+/-/g' | sed -E 's/^-+|-+$//g')

          TS=$(date -u +%Y%m%d-%H%M%S)
          BUILD_NUM=$(date -u +%Y%m%d%H%M%S)

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME}"
          else
            VERSION_NAME="${TS}-${REF_SLUG}"
          fi

          # Choose sing-box ref for building Libbox.xcframework.
          # - Tag builds: use same tag name
          # - Non-tag builds: default to dev-next, fallback to main if branch not found
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            SINGBOX_REF="${GITHUB_REF_NAME}"
          else
            SINGBOX_REF="dev-next"
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_num=$BUILD_NUM" >> "$GITHUB_OUTPUT"
          echo "singbox_ref=$SINGBOX_REF" >> "$GITHUB_OUTPUT"

      - name: Build Libbox.xcframework
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d "Libbox.xcframework" ]]; then
            echo "Libbox.xcframework already present."
            exit 0
          fi

          echo "Building Libbox.xcframework from sing-box ref: ${{ steps.version.outputs.singbox_ref }}"

          pushd ..
          if [[ ! -d "sing-box" ]]; then
            git clone --depth 1 --branch "${{ steps.version.outputs.singbox_ref }}" https://github.com/SagerNet/sing-box.git sing-box \
              || git clone --depth 1 https://github.com/SagerNet/sing-box.git sing-box
          fi
          popd

          pushd ../sing-box
          go version
          go env GOPATH

          # Install gomobile toolchain used by build_libbox
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.10
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.10
          gomobile init -v

          # Build only iOS variant and copy to ../sing-box-for-apple/Libbox.xcframework
          # NOTE: We only need device slice for this workflow (-sdk iphoneos).
          # Building iossimulator/amd64 can fail on macos-14 runners due to missing x86_64 simulator cronet libs.
          go run ./cmd/internal/build_libbox -target apple -platform ios/arm64
          popd

          if [[ ! -d "Libbox.xcframework" ]]; then
            echo "Libbox.xcframework was not produced." >&2
            exit 1
          fi

      - name: Build (iphoneos, unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            INFOPLIST_KEY_CFBundleShortVersionString="${{ steps.version.outputs.version_name }}" \
            INFOPLIST_KEY_CFBundleVersion="${{ steps.version.outputs.build_num }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: ldid sign for TrollStore
        shell: bash
        run: |
          set -euo pipefail

          PRODUCTS_DIR="$DERIVED_DATA/Build/Products"
          APP_PATH="$PRODUCTS_DIR/${CONFIGURATION}-iphoneos/sing-box.app"
          if [[ ! -d "$APP_PATH" ]]; then
            APP_PATH=$(find "$PRODUCTS_DIR" -maxdepth 3 -type d -path "*/${CONFIGURATION}-iphoneos/*.app" -print | head -n 1)
          fi

          if [[ -z "${APP_PATH}" || ! -d "${APP_PATH}" ]]; then
            echo "No .app found under: ${PRODUCTS_DIR}" >&2
            find "$PRODUCTS_DIR" -maxdepth 5 -type d -name "*.app" -print || true
            exit 1
          fi

          echo "Signing app bundle at: ${APP_PATH}"

          ENT_APP="SFI/SFI.entitlements"
          if [[ ! -f "$ENT_APP" ]]; then
            echo "Missing entitlements: ${ENT_APP}" >&2
            exit 1
          fi

          APP_EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")
          ldid -S"$ENT_APP" "$APP_PATH/$APP_EXEC"

          sign_macho_tree() {
            local root="$1"
            while IFS= read -r -d '' f; do
              if file -b "$f" | grep -q 'Mach-O'; then
                ldid -S "$f" || true
              fi
            done < <(find "$root" -type f -print0)
          }

          # Sign embedded extensions with their own entitlements when available
          if [[ -d "$APP_PATH/PlugIns" ]]; then
            for appex in "$APP_PATH"/PlugIns/*.appex; do
              [[ -d "$appex" ]] || continue
              name=$(basename "$appex")
              ent=""
              case "$name" in
                Extension.appex) ent="Extension/Extension.entitlements";;
                IntentsExtension.appex) ent="IntentsExtension/IntentsExtension.entitlements";;
                WidgetExtension.appex) ent="WidgetExtension/WidgetExtension.entitlements";;
                FileProviderExtension.appex) ent="FileProviderExtension/FileProviderExtension.entitlements";;
                TVExtension.appex) ent="TVExtension/TVExtension.entitlements";;
              esac

              exec=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$appex/Info.plist")
              if [[ -n "$ent" && -f "$ent" ]]; then
                ldid -S"$ent" "$appex/$exec"
              else
                ldid -S "$appex/$exec" || true
              fi

              sign_macho_tree "$appex"
            done
          fi

          # Sign embedded frameworks/dylibs/binaries inside the app
          sign_macho_tree "$APP_PATH"

      - name: Package .tipa
        run: |
          set -euo pipefail

          PRODUCTS_DIR="$DERIVED_DATA/Build/Products"
          APP_PATH="$PRODUCTS_DIR/${CONFIGURATION}-iphoneos/sing-box.app"
          if [[ ! -d "$APP_PATH" ]]; then
            APP_PATH=$(find "$PRODUCTS_DIR" -maxdepth 3 -type d -path "*/${CONFIGURATION}-iphoneos/*.app" -print | head -n 1)
          fi

          if [[ -z "${APP_PATH}" || ! -d "${APP_PATH}" ]]; then
            echo "No .app found under: ${PRODUCTS_DIR}" >&2
            find "$PRODUCTS_DIR" -maxdepth 5 -type d -name "*.app" -print || true
            exit 1
          fi

          APP_NAME=$(basename "$APP_PATH" .app)
          echo "Packaging: ${APP_NAME} from ${APP_PATH}"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          OUT_NAME="${APP_NAME}-${{ steps.version.outputs.version_name }}"
          xcrun ditto -c -k --sequesterRsrc --keepParent Payload "${OUT_NAME}.ipa"
          mv "${OUT_NAME}.ipa" "${OUT_NAME}.tipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-tipa
          path: "*.tipa"
          if-no-files-found: error
