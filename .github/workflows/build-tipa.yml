name: Build TrollStore TIPA

on:
  workflow_dispatch:
    inputs:
      sing_box_ref:
        description: "sing-box git ref to build Libbox from (defaults to v<MARKETING_VERSION>)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || \
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Resolve version and sing-box ref
        id: ref
        run: |
          version="$(xcodebuild -showBuildSettings -scheme SFI -configuration Release 2>/dev/null \
            | awk -F' = ' '/^    MARKETING_VERSION = /{print $2; exit}')"
          if [ -z "$version" ]; then
            echo "Failed to read MARKETING_VERSION" >&2; exit 1
          fi
          if [ -n "${{ inputs.sing_box_ref }}" ]; then
            ref="${{ inputs.sing_box_ref }}"
          else
            ref="v${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "App version: ${version}, sing-box ref: ${ref}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Install ldid and xcbeautify
        run: brew install ldid xcbeautify

      - name: Clone sing-box
        run: |
          git clone --depth 1 --branch "${{ steps.ref.outputs.ref }}" \
            https://github.com/SagerNet/sing-box.git "$RUNNER_TEMP/sing-box"

      - name: Cache Libbox.xcframework
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: Libbox.xcframework
          key: libbox-${{ runner.os }}-${{ steps.ref.outputs.ref }}-v1

      - name: Install gomobile (SagerNet fork)
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/sing-box
        run: make lib_install

      - name: Build Libbox.xcframework
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/sing-box
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_apple
          cp -R Libbox.xcframework "$GITHUB_WORKSPACE/Libbox.xcframework"

      - name: Resolve SPM packages
        run: |
          xcodebuild -resolvePackageDependencies -scheme SFI

      - name: Archive SFI (unsigned)
        run: |
          xcodebuild archive \
            -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SFI.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            | xcbeautify --renderer github-actions

      - name: Package TIPA
        id: tipa
        run: |
          out="build/SFI-${{ steps.ref.outputs.version }}-TrollStore.tipa"
          bash scripts/make_tipa.sh \
            build/SFI.xcarchive/Products/Applications/sing-box.app \
            "$out"
          echo "path=${out}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$out")" >> "$GITHUB_OUTPUT"

      - name: Upload TIPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tipa.outputs.name }}
          path: ${{ steps.tipa.outputs.path }}
          if-no-files-found: error

      - name: Attach TIPA to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.tipa.outputs.path }}
          fail_on_unmatched_files: true
